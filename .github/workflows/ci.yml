name: CampusRelay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and lint Android app
        run: >-
          bash gradlew
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:lintDebug
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campusrelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: |
            backend/CampusRelay.Api/CampusRelay.Api.csproj
            backend/CampusRelay.Api.Tests/CampusRelay.Api.Tests.csproj

      - name: Restore dependencies
        run: dotnet restore CampusRelay.Api.Tests/CampusRelay.Api.Tests.csproj

      - name: Build backend
        run: dotnet build CampusRelay.Api.Tests/CampusRelay.Api.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: >-
          dotnet test CampusRelay.Api.Tests/CampusRelay.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults/
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Render Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: campusrelay-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
